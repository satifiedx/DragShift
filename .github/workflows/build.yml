name: Build Windows app

on:
  push:
    branches: [main, media-native]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            native/target
          key: cargo-${{ hashFiles('native/Cargo.lock') }}

      - uses: actions/cache@v4
        with:
          path: build/ffmpeg-8.0.1/ffmpeg.zip
          key: ffmpeg-8.0.1-essentials

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Python tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build daemon, editor windows, installer, portable zip
        shell: pwsh
        run: ./packaging/build.ps1 -Python python

      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\DragShift-*-Setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=contextmenu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $dir = "$env:LOCALAPPDATA\Programs\DragShift"
          foreach ($f in "DragShift.exe", "ui\DragShiftUI.exe", "ffmpeg\ffmpeg.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "$f not installed" }
          }
          if (-not (Test-Path -LiteralPath "HKCU:\Software\Classes\*\shell\DragShift\command")) { throw "Context menu not registered" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process "$dir\ui\DragShiftUI.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($t.ExitCode -ne 0) { throw "Installed editor self-test failed" }
          Remove-Item Env:QT_QPA_PLATFORM
          $wav = "$env:RUNNER_TEMP\tone.wav"
          & "$dir\ffmpeg\ffmpeg.exe" -hide_banner -loglevel error -y -f lavfi -i "sine=d=2" $wav
          $r = Start-Process "$dir\DragShift.exe" -ArgumentList "--run", "convert:MP3", "`"$wav`"" -Wait -PassThru
          if ($r.ExitCode -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\tone.mp3")) { throw "Installed app could not convert audio" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path -LiteralPath "HKCU:\Software\Classes\*\shell\DragShift") { throw "Uninstall left the context menu behind" }
          if (Test-Path "$dir\DragShift.exe") { throw "Uninstall left files behind" }
          "Installer OK"

      - name: Logs
        if: always()
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA\DragShift\log.txt" -Tail 80 -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: DragShift-windows
          path: |
            dist/DragShift-*-Setup.exe
            dist/DragShift-*-Portable.zip
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { "release $tag already exists, keeping it"; exit 0 }
          $notes = if (Test-Path docs\RELEASE_NOTES.md) { "docs\RELEASE_NOTES.md" } else { $null }
          $files = (Get-ChildItem dist\DragShift-*-Setup.exe, dist\DragShift-*-Portable.zip, dist\SHA256SUMS.txt).FullName
          if ($notes) { gh release create $tag @files --title "DragShift $($tag.TrimStart('v'))" --notes-file $notes }
          else { gh release create $tag @files --title "DragShift $($tag.TrimStart('v'))" --generate-notes }
