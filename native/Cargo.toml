[package]
name = "dragshift"
version = "2.0.0"
edition = "2021"
description = "DragShift background daemon: tray, Shift+drag trigger, radial menu, notifications and ffmpeg media jobs"
license = "MIT"

[[bin]]
name = "DragShift"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "=0.58.0"

[dependencies.windows]
version = "=0.58.0"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
]

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
